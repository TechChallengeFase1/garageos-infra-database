name: Terraform

# Estrategia de deploy:
#
#   Pull Request     -> fmt + validate + plan. Nunca aplica.
#   push homolog     -> apply no workspace "homolog"
#   push main        -> apply no workspace "producao"
#   Run workflow     -> plan, apply ou destroy no ambiente escolhido
#
# Autenticacao por OIDC. Nenhuma credencial estatica da AWS neste repositorio.
#
# FILTRO DE CAMINHO: os padroes usam um asterisco so (`*.tf`, nao `**.tf`),
# entao casam apenas com a RAIZ do repositorio. Isso e proposital: `bootstrap/`
# e uma raiz Terraform separada, aplicada a mao, e mudancas nela nao devem
# disparar a pipeline do banco. Pelo mesmo motivo o `fmt -check` nao e
# recursivo - cada raiz responde pelos proprios arquivos.

on:
  pull_request:
    branches: [homolog, main]
    paths:
      - '*.tf'
      - '*.tfvars'
      - '.terraform.lock.hcl'
      - '.github/workflows/terraform.yml'
  push:
    branches: [homolog, main]
    paths:
      - '*.tf'
      - '*.tfvars'
      - '.terraform.lock.hcl'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente alvo
        required: true
        type: choice
        options: [homolog, producao]
      acao:
        description: "plan (so mostra) | apply (cria) | destroy (apaga o banco e os dados)"
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::266380777968:role/garageos-github-actions
  TF_VERSION: 1.15.7

# Serializa por AMBIENTE ALVO, nao por ref.
#
# Agrupar por `github.ref` era um erro: o check de um PR (refs/pull/N/merge) e
# o apply do merge (refs/heads/main) caem em grupos diferentes e rodam em
# paralelo - disputando o mesmo state no S3. Como o backend usa lock, um dos
# dois falha com "Error acquiring the state lock".
#
# Aqui um PR direcionado a main entra no mesmo grupo que um push na main,
# entao o segundo espera o primeiro terminar.
concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ github.event_name == 'pull_request' && 'Validar' || 'Executar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # O environment `producao` e onde se configura required reviewers
    # (Settings > Environments). Especialmente importante aqui: um destroy
    # neste repositorio apaga o banco E os dados.
    environment: ${{ github.event_name == 'pull_request' && 'validacao' || (github.ref_name == 'main' && 'producao' || 'homolog') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir contexto
        id: ctx
        run: |
          # Ambiente alvo
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AMBIENTE="${{ inputs.ambiente }}"
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.base_ref }}" = "main" ]; then
            AMBIENTE="producao"
          else
            AMBIENTE="homolog"
          fi
          echo "env=$AMBIENTE" >> "$GITHUB_OUTPUT"

          # Vai aplicar? Push nas branches de deploy, ou acao manual "apply".
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.acao }}" = "apply" ]; then
            echo "aplicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "aplicar=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Ambiente: $AMBIENTE"

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: tf-database-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ── Validacao ───────────────────────────────────────────────────────────

      - name: Formatacao
        run: terraform fmt -check -diff

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Selecionar workspace
        run: terraform workspace select -or-create "${{ steps.ctx.outputs.env }}"

      # ── Plan ────────────────────────────────────────────────────────────────

      - name: Plan
        if: inputs.acao != 'destroy'
        run: |
          terraform plan -input=false -no-color \
            -var-file="${{ steps.ctx.outputs.env }}.tfvars" \
            -out=tfplan

      - name: Resumo do plano
        if: inputs.acao != 'destroy'
        run: |
          {
            echo "### Terraform — ${{ steps.ctx.outputs.env }}"
            echo '```'
            terraform show -no-color tfplan | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Apply ───────────────────────────────────────────────────────────────
      # O RDS leva ~10 minutos na primeira criacao. A execucao parece travada
      # neste passo; e o comportamento normal.

      - name: Apply
        if: steps.ctx.outputs.aplicar == 'true'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Endpoint publicado
        if: steps.ctx.outputs.aplicar == 'true'
        run: |
          {
            echo "### Banco provisionado — ${{ steps.ctx.outputs.env }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Endpoint | \`$(terraform output -raw rds_endpoint)\` |"
            echo "| SG de cliente | \`$(terraform output -raw rds_client_security_group_id)\` |"
            echo "| Segredo | \`$(terraform output -raw secret_arn)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Destroy manual ──────────────────────────────────────────────────────
      # ATENCAO: aqui o destroy apaga o banco e todos os dados. O
      # skip_final_snapshot esta ligado (ambiente descartavel), entao nao ha
      # snapshot de recuperacao.

      - name: Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.acao == 'destroy'
        run: |
          terraform destroy -input=false -auto-approve \
            -var-file="${{ steps.ctx.outputs.env }}.tfvars"
